<header
  id="navbar"
  class="fixed top-0 left-0 right-0 z-50 bg-space-main/80 backdrop-blur-md border-b border-subtle transition-all duration-300"
>
  <div
    class="max-w-container mx-auto px-6 md:px-12 lg:px-16 h-20 flex items-center justify-between"
  >
    <a
      href="index.html#hero"
      class="flex items-center gap-3.5 group focus:outline-none"
      aria-label="After The Signal Home"
    >
      <div
        class="w-10 h-10 rounded-lg bg-space-card border border-cyan-subtle flex items-center justify-center relative overflow-hidden group-hover:border-space-cyan transition-colors"
      >
        <div
          class="absolute inset-0 bg-space-cyan/5 group-hover:bg-space-cyan/[.15] transition-colors"
        ></div>
        <svg
          class="w-5 h-5 text-space-cyan"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 12h2.5l2-5 3 10 3-14 3 12 2-5.5L19.5 12H22" />
          <circle cx="12.5" cy="3" r="1.2" class="fill-space-cyan" stroke="none" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span
          class="font-display font-bold text-sm sm:text-base tracking-[0.22em] text-space-textMain uppercase group-hover:text-space-cyan transition-colors"
          >AFTER THE SIGNAL</span
        >
        <span
          class="font-mono text-[10px] tracking-[0.16em] text-space-textMuted hidden sm:inline"
          data-i18n="brand.sub"
          >DEEP SPACE ARCHIVE // 01</span
        >
      </div>
    </a>

    <nav class="hidden lg:flex items-center gap-9" aria-label="Primary Navigation">
      <a href="index.html#hero" class="nav-link" data-nav="home" data-i18n="nav.home">Home</a>

      <div class="relative">
        <button
          type="button"
          class="nav-link flex items-center gap-1.5 focus:outline-none"
          data-popover-toggle="explore"
          aria-expanded="false"
        >
          <span data-i18n="nav.explore">Explore</span>
          <svg
            class="chevron w-4 h-4 text-space-cyan"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <div
          data-popover="explore"
          class="hidden absolute left-1/2 -translate-x-1/2 top-full pt-3 w-[540px] z-50"
        >
          <div
            class="bg-space-secondary/95 backdrop-blur-xl border border-cyan-subtle rounded-xl p-6 shadow-2xl"
          >
            <div class="grid grid-cols-2 gap-6">
              <div class="accent-cyan">
                <a
                  href="index.html#choose-world"
                  class="flex items-center justify-between pb-2.5 mb-3 border-b border-subtle group"
                >
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-accent"></span>
                    <span
                      class="font-display font-bold text-xs tracking-[0.18em] uppercase text-space-textMain group-hover:text-accent transition-colors"
                      data-i18n="world.moon"
                      >THE MOON</span
                    >
                  </div>
                  <span class="font-mono text-[10px] text-accent" data-i18n="nav.artifactsCount"
                    >3 ARTIFACTS →</span
                  >
                </a>
                <ul class="space-y-2" data-artifact-menu="moon"></ul>
              </div>

              <div class="accent-mars">
                <a
                  href="index.html#choose-world"
                  class="flex items-center justify-between pb-2.5 mb-3 border-b border-subtle group"
                >
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-accent"></span>
                    <span
                      class="font-display font-bold text-xs tracking-[0.18em] uppercase text-space-textMain group-hover:text-accent transition-colors"
                      data-i18n="world.mars"
                      >MARS</span
                    >
                  </div>
                  <span class="font-mono text-[10px] text-accent" data-i18n="nav.artifactsCount"
                    >3 ARTIFACTS →</span
                  >
                </a>
                <ul class="space-y-2" data-artifact-menu="mars"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <a href="cards.html" class="nav-link" data-nav="archive" data-i18n="nav.archive">Archive</a>
      <a href="index.html#what-was-left" class="nav-link" data-i18n="nav.about">About</a>
    </nav>

    <div class="hidden lg:flex items-center gap-3.5">
      <div class="relative">
        <button
          type="button"
          data-popover-toggle="lang"
          aria-expanded="false"
          title="Language"
          class="h-9 px-3 rounded-lg bg-space-card/90 border border-subtle hover:border-space-cyan/50 flex items-center gap-1.5 text-xs font-mono tracking-wider text-space-textMain transition-colors"
        >
          <svg
            class="w-3.5 h-3.5 text-space-cyan"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="10" />
            <path
              d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          <span data-lang-label>EN</span>
          <svg
            class="chevron w-3 h-3 text-space-textMuted"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
        <div
          data-popover="lang"
          class="hidden absolute right-0 mt-2 w-36 bg-space-secondary border border-cyan-subtle rounded-lg shadow-xl py-1.5 z-50"
        >
          <button type="button" class="menu-option" data-lang="en">
            <span>EN — English</span><span class="dot">●</span>
          </button>
          <button type="button" class="menu-option" data-lang="es">
            <span>ES — Español</span><span class="dot">●</span>
          </button>
          <button type="button" class="menu-option" data-lang="fr">
            <span>FR — Français</span><span class="dot">●</span>
          </button>
          <button type="button" class="menu-option" data-lang="ar">
            <span>AR — العربية</span><span class="dot">●</span>
          </button>
        </div>
      </div>

      <div class="relative">
        <button
          type="button"
          data-popover-toggle="age"
          aria-expanded="false"
          title="Age & Reading Depth Mode"
          class="h-9 px-3.5 rounded-lg bg-space-card/90 border border-subtle hover:border-space-cyan/50 flex items-center gap-2 text-xs font-mono tracking-wider text-space-textMain transition-colors"
        >
          <svg
            class="w-4 h-4 text-space-cyan"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
            />
          </svg>
          <span class="text-space-textMuted" data-i18n="nav.mode">MODE:</span>
          <span class="text-space-cyan font-medium" data-age-label data-i18n="age.all.short"
            >ALL AGES</span
          >
        </button>
        <div
          data-popover="age"
          class="hidden absolute right-0 mt-2 w-64 bg-space-secondary border border-cyan-subtle rounded-xl shadow-2xl p-3.5 z-50"
        >
          <p
            class="font-mono text-[10px] tracking-[0.16em] uppercase text-space-textMuted mb-2.5"
            data-i18n="age.title"
          >
            STORYTELLING DEPTH & AGE LEVEL
          </p>
          <div class="space-y-1.5">
            <button type="button" class="age-option" data-age="cadet">
              <p
                class="age-name text-xs font-medium text-space-textMain"
                data-i18n="age.cadet.name"
              >
                Young Explorer (Ages 8–12)
              </p>
              <p class="text-[11px] text-space-textMuted" data-i18n="age.cadet.desc">
                Accessible visual storytelling
              </p>
            </button>
            <button type="button" class="age-option" data-age="all">
              <p class="age-name text-xs font-medium text-space-textMain" data-i18n="age.all.name">
                Documentary Mode (Default)
              </p>
              <p class="text-[11px] text-space-textMuted" data-i18n="age.all.desc">
                Cinematic narrative & mission facts
              </p>
            </button>
            <button type="button" class="age-option" data-age="telemetry">
              <p
                class="age-name text-xs font-medium text-space-textMain"
                data-i18n="age.telemetry.name"
              >
                Deep Telemetry (Ages 16+)
              </p>
              <p class="text-[11px] text-space-textMuted" data-i18n="age.telemetry.desc">
                Full orbital & engineering specs
              </p>
            </button>
          </div>
        </div>
      </div>

      <button
        type="button"
        data-theme-toggle
        title="Toggle light / dark theme"
        aria-label="Toggle light / dark theme"
        data-i18n-title="theme.toggle"
        data-i18n-aria-label="theme.toggle"
        class="theme-toggle w-9 h-9 rounded-lg bg-space-card/90 border border-subtle hover:border-space-cyan/50 flex items-center justify-center text-space-cyan transition-colors"
      >
        <svg
          class="icon-to-light w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg
          class="icon-to-dark w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
      </button>
    </div>

    <div class="lg:hidden flex items-center gap-2">
      <button
        type="button"
        data-theme-toggle
        title="Toggle light / dark theme"
        aria-label="Toggle light / dark theme"
        data-i18n-title="theme.toggle"
        data-i18n-aria-label="theme.toggle"
        class="theme-toggle w-10 h-10 rounded-lg bg-space-card border border-subtle hover:border-space-cyan/50 flex items-center justify-center text-space-cyan transition-colors"
      >
        <svg
          class="icon-to-light w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg
          class="icon-to-dark w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" />
        </svg>
      </button>
      <button
        type="button"
        id="mobile-menu-btn"
        data-mobile-toggle
        aria-label="Open Navigation Menu"
        class="lg:hidden w-10 h-10 rounded-lg bg-space-card border border-subtle flex items-center justify-center text-space-textMain hover:text-space-cyan hover:border-space-cyan/40 transition-colors"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </div>

  <div data-mobile-menu class="hidden lg:hidden bg-space-main/95 border-b border-subtle px-6 py-6">
    <div
      class="flex flex-col space-y-4 font-display font-semibold tracking-widest uppercase text-sm"
    >
      <a
        href="index.html#hero"
        class="mobile-link text-space-textMain hover:text-space-cyan py-1"
        data-i18n="nav.home"
        >Home</a
      >
      <a
        href="index.html#choose-world"
        class="mobile-link text-space-textMain hover:text-space-cyan py-1"
        data-i18n="nav.exploreWorlds"
        >Explore Worlds (Moon & Mars)</a
      >
      <a
        href="index.html#stories"
        class="mobile-link text-space-textMain hover:text-space-cyan py-1"
        data-i18n="nav.featured"
        >Featured Artifacts (6)</a
      >
      <a
        href="cards.html"
        class="mobile-link text-space-textMain hover:text-space-cyan py-1"
        data-i18n="nav.archive"
        >Archive</a
      >
      <a
        href="index.html#what-was-left"
        class="mobile-link text-space-textMain hover:text-space-cyan py-1"
        data-i18n="nav.aboutProject"
        >About The Project</a
      >

      <div
        class="pt-4 border-t border-subtle flex items-center justify-between font-mono text-xs normal-case tracking-normal font-normal"
      >
        <div class="flex items-center gap-2 text-space-textMuted">
          <span data-i18n="nav.language">LANGUAGE:</span>
          <button type="button" class="menu-option !w-auto !p-1.5 rounded" data-lang="en">
            EN
          </button>
          <button type="button" class="menu-option !w-auto !p-1.5 rounded" data-lang="es">
            ES
          </button>
          <button type="button" class="menu-option !w-auto !p-1.5 rounded" data-lang="fr">
            FR
          </button>
          <button type="button" class="menu-option !w-auto !p-1.5 rounded" data-lang="ar">
            AR
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
